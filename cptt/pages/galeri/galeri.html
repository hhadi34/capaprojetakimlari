<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeri - Çapa Proje Takımları</title>
  <link rel="icon" type="image/png" href="../../cptt.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    :root {
      --accent: #ab8d53;
      --primary: #101e3c;
      --primary-rgb: 16, 30, 60;
      --accent-rgb: 171, 141, 83;
    }

    body { color: var(--primary); background: #fff; }
    .navbar { background: var(--primary); }

    .gallery-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      grid-template-rows: 280px 280px 280px;
      gap: 12px;
    }

    .gallery-item {
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .gallery-item:hover {
      transform: scale(1.02);
      box-shadow: 0 12px 40px rgba(0,0,0,0.2);
      z-index: 2;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .gallery-item--big {
      grid-row: 1 / 3;
      grid-column: 1;
    }

    .gallery-item--r1 { grid-row: 1; grid-column: 2; }
    .gallery-item--r2 { grid-row: 1; grid-column: 3; }
    .gallery-item--r3 { grid-row: 2; grid-column: 2; }
    .gallery-item--r4 { grid-row: 2; grid-column: 3; }
    .gallery-item--b1 { grid-row: 3; grid-column: 1; }
    .gallery-item--b2 { grid-row: 3; grid-column: 2 / 4; }

    .gallery-placeholder {
      width: 100%;
      height: 100%;
      background: rgba(var(--primary-rgb), 0.06);
      border: 2px dashed rgba(var(--primary-rgb), 0.15);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      color: rgba(var(--primary-rgb), 0.2);
    }

    /* Lightbox */
    .lightbox-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 3000;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }
    .lightbox-overlay.active { display: flex; }
    .lightbox-overlay img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
    }

    @media (max-width: 768px) {
      .gallery-grid {
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 240px 200px 200px 200px;
      }
      .gallery-item--big { grid-row: 1; grid-column: 1 / 3; }
      .gallery-item--r1 { grid-row: 2; grid-column: 1; }
      .gallery-item--r2 { grid-row: 2; grid-column: 2; }
      .gallery-item--r3 { grid-row: 3; grid-column: 1; }
      .gallery-item--r4 { grid-row: 3; grid-column: 2; }
      .gallery-item--b1 { grid-row: 4; grid-column: 1; }
      .gallery-item--b2 { grid-row: 4; grid-column: 2; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <div class="logo">
        <a href="../../index.html"><img src="../../cptt.png" alt="ÇPTT Logo" style="height:36px;width:auto;border-radius:6px;"></a>
        <span style="color:rgba(255,255,255,0.3);font-size:1.2rem;">|</span>
        <span>Galeri</span>
      </div>
      <button class="nav-toggle" aria-label="Menü">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links">
        <li><a href="../../index.html">Ana Sayfa</a></li>
      </ul>
    </div>
  </nav>

  <section class="section" style="padding-top:120px;">
    <div class="container">
      <div class="section-header fade-in">
        <h2>Galeri</h2>
        <div class="section-divider"></div>
        <p>Projelerimizden ve etkinliklerimizden kareler.</p>
      </div>
      <div class="gallery-grid">
        <div class="gallery-item gallery-item--big fade-in" onclick="openLightbox(this)">
          <img src="cptt galeri ana foto.jpeg" alt="Çapa Fen Lisesi">
        </div>
        <div class="gallery-item gallery-item--r1 fade-in" onclick="openLightbox(this)">
          <img src="yz.jpg" alt="Yapay Zeka">
        </div>
        <div class="gallery-item gallery-item--r2 fade-in" onclick="openLightbox(this)">
          <img src="anka (1).jpeg" alt="ANKA İHA">
        </div>
        <div class="gallery-item gallery-item--r3 fade-in" onclick="openLightbox(this)">
          <img src="anka (2).jpeg" alt="ANKA İHA">
        </div>
        <div class="gallery-item gallery-item--r4 fade-in" onclick="openLightbox(this)">
          <img src="frc.jpeg" alt="FRC">
        </div>
        <div class="gallery-item gallery-item--b1 fade-in">
          <div class="gallery-placeholder">📷</div>
        </div>
        <div class="gallery-item gallery-item--b2 fade-in">
          <div class="gallery-placeholder">📷</div>
        </div>
      </div>
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox-overlay" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="">
  </div>

  <footer class="footer" style="background:#0a1628;">
    <div class="container">
      <div class="footer-bottom">
        <p>&copy; 2026 Çapa Proje Takımları Topluluğu</p>
      </div>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const navToggle = document.querySelector('.nav-toggle');
      const navLinks = document.querySelector('.nav-links');
      navToggle?.addEventListener('click', () => navLinks.classList.toggle('active'));
      document.querySelectorAll('.nav-links a').forEach(a => {
        a.addEventListener('click', () => navLinks.classList.remove('active'));
      });

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
      }, { threshold: 0.1 });
      document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
    });

    function openLightbox(el) {
      const img = el.querySelector('img');
      if (!img) return;
      document.getElementById('lightbox-img').src = img.src;
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>

</body>
</html>
